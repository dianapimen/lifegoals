name: Angular_DockerImage_v2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v2

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v1
        with:
          node-version: 20.x

      - name: npm install
        run: npm install

      # Se crea la carpeta docs con el build
      - name: build
        run: |
          npx ng build --output-path=docs

      # El documento indica mover los archivos de docs/browser a docs (Pág 3)
      - name: Prepare docs folder
        run: |
          mv docs/browser/* docs/
          rm -rf docs/browser

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USER --password-stdin

      - name: Download and run the Docker base image
        run: docker run -d --name http_base httpd

      - name: copy model to the Docker image
        run: docker cp docs/. http_base:/usr/local/apache2/htdocs

      - name: Build the custom Docker image
        run: |
          docker commit --change "ENV MODEL_NAME http_base" http_base ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }}
          docker tag ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }} ${{secrets.DOCKER_USER}}/lifegoals:latest

      - name: Docker Push
        run: |
          docker push ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }}
          docker push ${{secrets.DOCKER_USER}}/lifegoals:latest
